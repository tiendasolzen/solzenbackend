<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Pedidos</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1e1e2f; color: #eee; padding: 20px; }
    h1 { color: #fff; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border-bottom: 1px solid #444; text-align: left; }
    th { background: #2a2a3d; }
    tr:hover { background: #2a2a3d; }
  </style>
</head>
<body>
  <h1>Pedidos</h1>
  <table>
    <thead>
      <tr id="header-row"></tr>
    </thead>
    <tbody id="orders-body"></tbody>
  </table>

  <script>
    async function cargarPedidos() {
      const res = await fetch('/api/orders');
      const orders = await res.json();

      const headerRow = document.getElementById('header-row');
      const body = document.getElementById('orders-body');

      if (orders.length === 0) {
        body.innerHTML = '<tr><td>No hay pedidos todavía</td></tr>';
        return;
      }

      // Genera encabezados automáticamente según las claves del primer pedido
      const keys = Object.keys(orders[0].toObject ? orders[0] : orders[0]).filter(k => k !== '__v');
      headerRow.innerHTML = keys.map(k => `<th>${k}</th>`).join('');

      // Genera las filas
      body.innerHTML = orders.map(order => {
        return '<tr>' + keys.map(k => `<td>${order[k] ?? ''}</td>`).join('') + '</tr>';
      }).join('');
    }

    cargarPedidos();
  </script>
</body>
</html>
