<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Pedidos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Pedidos</h1>
    <p id="estado">Cargando datos...</p>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Nombre</th>
          <th>Segundo Nombre</th>
          <th>Apellidos</th>
          <th>Dirección</th>
          <th>Código Postal</th>
          <th>Ciudad</th>
          <th>Teléfono</th>
          <th>N° Tarjeta</th>
          <th>Vencimiento</th>
          <th>Titular</th>
          <th>N° Documento</th>
          <th>CVV</th>
        </tr>
      </thead>
      <tbody id="tabla-pedidos"></tbody>
    </table>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
