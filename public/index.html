<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Pedidos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Pedidos</h1>
    <p id="estado">Cargando datos...</p>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Dirección</th>
          <th>Pack</th>
          <th>Precio</th>
          <th>N° Cliente</th>
          <th>Titular Cuenta</th>
          <th>Vencimiento</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="tabla-pedidos"></tbody>
    </table>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
