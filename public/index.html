<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard de Productos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Productos</h1>
    <p id="estado">Cargando datos...</p>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Stock</th>
          <th>Categoría</th>
        </tr>
      </thead>
      <tbody id="tabla-productos">
        <!-- Las filas se generan dinámicamente desde app.js -->
      </tbody>
    </table>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
